version: '3.8'

services:
  # RedPanda - Kafka-compatible streaming platform
  redpanda:
    image: docker.redpanda.com/vectorized/redpanda:v24.2.9
    container_name: flowbank-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081" # Schema Registry
      - "18082:18082" # Pandaproxy
      - "19092:19092" # Kafka API (external)
      - "19644:9644"  # Admin API
    networks:
      - flowbank-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  # RedPanda Console - Web UI for Kafka
  redpanda-console:
    image: docker.redpanda.com/vectorized/console:v2.7.2
    container_name: flowbank-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8090:8080"
    networks:
      - flowbank-network
    depends_on:
      - redpanda

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: flowbank-postgres
    environment:
      POSTGRES_DB: flowbank
      POSTGRES_USER: flowbank_user
      POSTGRES_PASSWORD: flowbank_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - flowbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbank_user -d flowbank"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Producer Service - Generates fake transactions
  producer:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.producer
    container_name: flowbank-producer
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: transactions
      PRODUCER_INTERVAL: 3s
    networks:
      - flowbank-network
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure

  # Consumer Service - Processes transactions from Kafka
  consumer:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.consumer
    container_name: flowbank-consumer
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: transactions
      KAFKA_GROUP_ID: flowbank-consumer-group
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowbank
      DB_USER: flowbank_user
      DB_PASSWORD: flowbank_pass
    networks:
      - flowbank-network
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # API Service - REST API for querying data
  api:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.api
    container_name: flowbank-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowbank
      DB_USER: flowbank_user
      DB_PASSWORD: flowbank_pass
      API_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - flowbank-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

networks:
  flowbank-network:
    driver: bridge

volumes:
  postgres-data: